# Library costs for JavaScript, and for TypeScript, which reads this table too.
#
# `n` is the size of the receiver (or of the argument `size_of` names), `m` the size of
# the first argument. `space` is the extra space the call allocates and defaults to 1.
# `pure` marks calls with no side effects, so repeating one with the same arguments in a
# loop is repeated work. A receiver of "*" stands for any type that has the method, and
# is used, at lower confidence, only when the receiver's type is not known.

# Arrays. `find`, `some`, `every`, `filter` and `map` take a callback, which makes them
# loops of their own; they are read as loops, not looked up here.
- {id: js.array.includes, receiver: [Array], method: includes, cost: n, pure: true}
- {id: js.array.indexOf, receiver: [Array], method: indexOf, cost: n, pure: true}
- {id: js.array.lastIndexOf, receiver: [Array], method: lastIndexOf, cost: n, pure: true}
- {id: js.array.slice, receiver: [Array], method: slice, cost: n, space: n, pure: true}
- {id: js.array.concat, receiver: [Array], method: concat, cost: n, space: n, pure: true}
- {id: js.array.flat, receiver: [Array], method: flat, cost: n, space: n, pure: true}
- {id: js.array.join, receiver: [Array], method: join, cost: n, space: n, pure: true}
- {id: js.array.reverse, receiver: [Array], method: reverse, cost: n}
- {id: js.array.sort, receiver: [Array], method: sort, cost: n log n}
- {id: js.array.toSorted, receiver: [Array], method: toSorted, cost: n log n, space: n, pure: true}
- {id: js.array.toReversed, receiver: [Array], method: toReversed, cost: n, space: n, pure: true}
- {id: js.array.splice, receiver: [Array], method: splice, cost: n}
- {id: js.array.shift, receiver: [Array], method: shift, cost: n}
- {id: js.array.unshift, receiver: [Array], method: unshift, cost: n}
- {id: js.array.fill, receiver: [Array], method: fill, cost: n}
- {id: js.array.copyWithin, receiver: [Array], method: copyWithin, cost: n}
- {id: js.array.push, receiver: [Array], method: push, cost: 1}
- {id: js.array.pop, receiver: [Array], method: pop, cost: 1}
- {id: js.array.at, receiver: [Array], method: at, cost: 1}
- {id: js.array.from, fn: Array.from, size_of: arg0, cost: n, space: n, pure: true}

