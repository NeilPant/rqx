# Keyed collections answer by key, so a lookup in one costs the same however large it is.
- {id: js.keyed.has, receiver: [Set, Map, WeakSet, WeakMap], method: has, cost: 1}
- {id: js.keyed.get, receiver: [Map, WeakMap], method: get, cost: 1}
- {id: js.keyed.set, receiver: [Map, WeakMap], method: set, cost: 1}
- {id: js.keyed.add, receiver: [Set, WeakSet], method: add, cost: 1}
- {id: js.keyed.delete, receiver: [Set, Map, WeakSet, WeakMap], method: delete, cost: 1}
- {id: js.keyed.clear, receiver: [Set, Map], method: clear, cost: n}

