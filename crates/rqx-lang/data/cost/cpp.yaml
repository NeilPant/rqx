# Library costs for C++. See javascript.yaml for how an entry reads. An algorithm is
# sized by the container its first iterator belongs to: `std::find(v.begin(), v.end(), x)`
# is over the size of `v`. A name used without `std::` reads the same.

# Vectors and deques.
- {id: cpp.vector.push_back, receiver: [vector, deque], method: push_back, cost: 1}
- {id: cpp.vector.emplace_back, receiver: [vector, deque], method: emplace_back, cost: 1}
- {id: cpp.vector.pop_back, receiver: [vector, deque], method: pop_back, cost: 1}
- {id: cpp.vector.insert, receiver: [vector], method: insert, cost: n}
- {id: cpp.vector.erase, receiver: [vector], method: erase, cost: n}
- {id: cpp.vector.clear, receiver: [vector, deque, list], method: clear, cost: n}
- {id: cpp.vector.resize, receiver: [vector, deque], method: resize, cost: n}
- {id: cpp.vector.assign, receiver: [vector, deque], method: assign, cost: n}
- {id: cpp.vector.at, receiver: [vector, deque], method: at, cost: 1}
- {id: cpp.vector.size, receiver: [vector, deque, list, set, map, unordered_set, unordered_map, string], method: size, cost: 1}
- {id: cpp.deque.push_front, receiver: [deque, list], method: push_front, cost: 1}
