[package]
name = "rqx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Finds dead code, duplication and architectural drift in TypeScript, JavaScript, Python, Go, Java and C++, and names the refactoring that fixes each one."
readme = "../../README.md"
documentation = "https://github.com/jadhamwi21/rqx/tree/main/docs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
globset = "0.4"
ignore = "0.4.33"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
ratatui = "0.30.2"
rmcp = { version = "3.2.0", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
rqx-core.workspace = true
rqx-lang.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.0"
tokio = { version = "1.53.1", features = ["rt", "io-std", "net", "sync", "time"] }
serde-saphyr = "2.1.1"
toml = "1.1.5"
toml_edit = "0.25.13"
yaml-edit = "0.3.6"
unicode-width = "0.2.2"
clap_complete = "4.6.9"

[dev-dependencies]
rqx-core.workspace = true
