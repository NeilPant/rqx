[package]
name = "rqx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
ignore = "0.4.33"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
ratatui = "0.30.2"
rqx-core = { version = "0.1.0", path = "../rqx-core" }
rqx-lang = { version = "0.1.0", path = "../rqx-lang" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.0"
toml = "1.1.5"
unicode-width = "0.2.2"

[dev-dependencies]
rqx-core = { path = "../rqx-core" }
