# For legacy code, or a repository that must stay shippable while it is cleaned up.
# Thresholds are set at values a large existing codebase can meet, and the rules
# that report matters of opinion are off.

thresholds:
  relative_climb: 3
  fan_out: 30
  fan_in: 30
  long_function_statements: 60
  cognitive_complexity: 25
  nesting_depth: 4
  max_params: 6
  class_members: 30
  class_statements: 300
  module_statements: 800
  function_locals: 25
  try_statements: 20
  narrated_run: 6
  explanation_ratio: 3
  guard_cascade: 5
  sole_author_commits: 10
  hotspot_commits: 20
  cyclomatic_complexity: 20
  max_results: 5
  class_collaborators: 14
  log_percent: 60
  inheritance_depth: 5
  todo_age_days: 365
  condition_operands: 4
  message_chain_depth: 4
  magic_number_repeats: 5
  expression_operations: 8
  declaration_distance_lines: 40

rules:
  disabled:
    - magic-number
    - redundant-comment
    - distant-declaration
    - buried-configuration
    - obscured-expression
    - lazy-class
    - data-class
    - flag-argument
    - complex-condition
