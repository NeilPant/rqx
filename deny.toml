# cargo-deny policy, checked by the `deny` job in .github/workflows/rqx.yml.
#
# The license allow list is the set of identifiers that appear in the dependency
# graph and are permissive. An identifier not listed here fails the build on purpose:
# a new dependency under a license nobody has read should be a decision, not a
# silent pass.

[advisories]
# Vulnerabilities are always errors in cargo-deny v2, with no setting to relax them.
# An unmaintained crate is worth knowing about but is not a reason to stop a merge.
unmaintained = "all"
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
# terminfo reaches the graph through termwiz, one of ratatui's backends, and is the
# only WTFPL crate. WTFPL places no conditions on use, so it is allowed for that crate
# alone rather than for anything that might arrive under it later.
exceptions = [
  { allow = ["WTFPL"], crate = "terminfo" },
]

[bans]
# Two versions of one crate compile twice and bloat the binary, but a transitive
# split is often not ours to fix, so it is reported rather than blocked.
multiple-versions = "warn"
# A wildcard requirement lets any future release in, including a breaking one.
wildcards = "deny"

[sources]
# Everything comes from crates.io. A git or alternate registry dependency is a source
# of code that nobody reviewed when it was pinned.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
