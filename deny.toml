# cargo-deny policy, checked by the `deny` job in .github/workflows/rqx.yml.
#
# The license allow list is the set of identifiers that appear in the dependency
# graph and are permissive. An identifier not listed here fails the build on purpose:
# a new dependency under a license nobody has read should be a decision, not a
# silent pass.

[advisories]
# Vulnerabilities, unsound crates and unmaintained crates are all errors in cargo-deny
# v2; the only way past one is an entry in `ignore`, and each entry names its reason.
unmaintained = "all"
yanked = "warn"
ignore = [
  # chrono is unmaintained and rqx never calls it. rmcp depends on it outright, and
  # schemars pulls it in through the `chrono04` feature rmcp turns on, so neither
  # edge is ours to cut. There is no vulnerability behind the advisory. Drop this
  # entry when rmcp moves to jiff or time; until then, review it by 2027-02-18.
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, reachable only through rmcp and schemars" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
# Two versions of one crate compile twice and bloat the binary, but a transitive
# split is often not ours to fix, so it is reported rather than blocked.
multiple-versions = "warn"
# A wildcard requirement lets any future release in, including a breaking one.
wildcards = "deny"

[sources]
# Everything comes from crates.io. A git or alternate registry dependency is a source
# of code that nobody reviewed when it was pinned.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
