# Thresholds tuned only where the default cannot be reached by a corpus this
# small: twenty importers needs twenty files that do nothing else.
[thresholds]
fan_in = 1
module_statements = 45

[rules]
disabled = []
enabled = ["tiny-switch","meaningless-name","primitive-obsession","hungarian-notation","short-name-wide-scope","negative-conditional","divergent-change","misleading-pattern-name","inconsistent-vocabulary","alternative-classes","parallel-inheritance","emoji-in-source","debug-output","reaches-into-private"]

[patterns]
enabled = ["memento", "interpreter"]
