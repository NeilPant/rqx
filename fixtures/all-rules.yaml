# Thresholds tuned only where the default cannot be reached by a corpus this
# small: twenty importers needs twenty files that do nothing else.
thresholds:
  fan_in: 1
  module_statements: 45
  class_collaborators: 2

rules:
  disabled: []
  enabled:
    - tiny-switch
    - meaningless-name
    - primitive-obsession
    - hungarian-notation
    - short-name-wide-scope
    - negative-conditional
    - divergent-change
    - misleading-pattern-name
    - inconsistent-vocabulary
    - alternative-classes
    - parallel-inheritance
    - emoji-in-source
    - debug-output
    - reaches-into-private
    - real-world-test
    - unlabelled-assertions
    - unexplained-expected-value
    - method-ignores-instance
    - eager-test
    - assign-once-field

patterns:
  enabled: [memento, interpreter]

ignore:
  # The repository's own `RQX.toml` does not read this tree — every file in it is a
  # planted violation. This layer sits over that one, which is how the fixtures stay
  # readable to the tests that exist to read them.
  patterns: []
