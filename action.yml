name: "Rqx"
description: "Find dead code, duplication and architectural drift in TypeScript, JavaScript, Python, Go, Java and C++, with a reason for every finding."
author: "Jad Alhamwi"
branding:
  icon: search
  color: orange

inputs:
  path:
    description: "Directory to analyze."
    required: false
    default: "."
  base:
    description: "Revision to compare against. Set to an empty string to scan the whole project instead of a diff."
    required: false
    default: ""
  config:
    description: "Path to a YAML config file, such as rqx.yaml."
    required: false
    default: ""
  fail-on:
    description: "Lowest severity that fails the job: error, warning, info or never. Empty uses rqx.yaml."
    required: false
    default: ""
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "rqx.sarif"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning."
    required: false
    default: "true"

outputs:
  findings:
    description: "Number of findings reported."
    value: ${{ steps.rqx.outputs.findings }}
  passed:
    description: "Whether the gate passed."
    value: ${{ steps.rqx.outputs.passed }}

runs:
  using: composite
  steps:
    # The version comes from the checked-out action rather than from `action_ref`,
    # because the ref is often a moving major tag (`@v1`) that no release object is
    # named after. Reading the manifest the runner already has means the binary
    # always matches the action code beside it.
    - name: Install rqx
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        # The repository the action itself came from, so a fork publishing its own
        # releases downloads its own binaries rather than this one's.
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -uo pipefail
        version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$ACTION_PATH/Cargo.toml" | head -1)"

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)    triple=linux-x64    ;;
          Linux/ARM64)  triple=linux-arm64  ;;
          macOS/X64)    triple=darwin-x64   ;;
          macOS/ARM64)  triple=darwin-arm64 ;;
          Windows/X64)  triple=win32-x64    ;;
          Windows/ARM64) triple=win32-arm64 ;;
          *)            triple=""           ;;
        esac

        # Backslashes, because RUNNER_TEMP arrives in Windows form on a Windows
        # runner and bash reads them as escapes; GITHUB_PATH takes either form.
        home="${RUNNER_TEMP//\\//}/rqx"
        mkdir -p "$home/download"

        # A release the tag has no binary for is not an error here: a fork, a
        # prerelease that skipped a platform, or an action pinned to a commit ahead
        # of the last release all land here and are still meant to work.
        if [ -n "$triple" ] && [ -n "${ACTION_REPO:-}" ] && gh release download "v$version" \
             --repo "$ACTION_REPO" \
             --pattern "rqx-$version-$triple.tar.gz" --pattern SHA256SUMS \
             --dir "$home/download" --clobber; then
          # `shasum` because a macOS runner has no GNU coreutils, and the one
          # expected line rather than `--check` because that flag needs every other
          # platform's tarball to be present too.
          archive="rqx-$version-$triple.tar.gz"
          want="$(awk -v name="$archive" '$2 == name {print $1}' "$home/download/SHA256SUMS")"
          if command -v sha256sum >/dev/null 2>&1; then
            got="$(sha256sum "$home/download/$archive" | cut -d' ' -f1)"
          else
            got="$(shasum -a 256 "$home/download/$archive" | cut -d' ' -f1)"
          fi
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::$archive hashes to ${got:-nothing}, and SHA256SUMS says ${want:-nothing}"
            exit 1
          fi
          tar xzf "$home/download/$archive" -C "$home"
          chmod +x "$home"/rqx*
          echo "$home" >> "$GITHUB_PATH"
          echo "source=download" >> "$GITHUB_OUTPUT"
          echo "rqx $version, downloaded"
        else
          echo "::notice::no published binary for v$version on $RUNNER_OS/$RUNNER_ARCH; building from source"
          echo "source=build" >> "$GITHUB_OUTPUT"
        fi

    - uses: dtolnay/rust-toolchain@stable
      if: steps.install.outputs.source == 'build'
    - uses: Swatinem/rust-cache@v2
      if: steps.install.outputs.source == 'build'
      with:
        workspaces: ${{ github.action_path }}
    - name: Build rqx
      if: steps.install.outputs.source == 'build'
      shell: bash
      run: cargo install --locked --path "${{ github.action_path }}/crates/rqx-cli"

    - name: Run rqx
      id: rqx
      shell: bash
      env:
        RQX_PATH: ${{ inputs.path }}
        RQX_BASE: ${{ inputs.base }}
        RQX_CONFIG: ${{ inputs.config }}
        RQX_FAIL_ON: ${{ inputs.fail-on }}
        RQX_SARIF: ${{ inputs.sarif-file }}
      run: |
        set -uo pipefail
        summary="$(mktemp)"

        args=("$RQX_PATH")
        [ -n "$RQX_CONFIG" ] && args+=(--config "$RQX_CONFIG")
        [ -n "$RQX_FAIL_ON" ] && args+=(--fail-on "$RQX_FAIL_ON")

        # One analysis, four renderings: the log, the inline annotations, the SARIF
        # upload and the job summary. Running rqx twice to get two of them doubled
        # the cost of the slowest step in the job.
        args+=(--reporter terminal --reporter github)
        args+=(--reporter "sarif=$RQX_SARIF" --reporter "markdown=$summary")

        if [ -n "$RQX_BASE" ]; then
          # A review diffs `base...HEAD`, which needs the commit the two branches
          # share. `actions/checkout` clones one commit deep by default, so fetching
          # the base one commit deep leaves two histories with no ancestor between
          # them and the diff fails. Deepen until there is one, or say why not.
          git fetch --no-tags origin "$RQX_BASE" 2>/dev/null || true
          if ! git merge-base HEAD FETCH_HEAD >/dev/null 2>&1; then
            git fetch --no-tags --deepen=200 origin "$RQX_BASE" 2>/dev/null || true
          fi
          if ! git merge-base HEAD FETCH_HEAD >/dev/null 2>&1; then
            git fetch --no-tags --unshallow origin "$RQX_BASE" 2>/dev/null || true
          fi
          if ! git merge-base HEAD FETCH_HEAD >/dev/null 2>&1; then
            echo "::warning::no commit shared with $RQX_BASE; add fetch-depth: 0 to actions/checkout"
          fi
          rqx check "${args[@]}" --base "$RQX_BASE"
        else
          rqx scan "${args[@]}"
        fi
        status=$?

        # Appended rather than written: other steps in the job own this file too.
        [ -n "${GITHUB_STEP_SUMMARY:-}" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY"

        # SARIF lists a waived finding too, marked suppressed, and the output is the
        # number of findings reported.
        findings=$(jq '[.runs[].results[] | select((.suppressions // []) == [])] | length' "$RQX_SARIF" 2>/dev/null || echo 0)
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "passed=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        exit "$status"

    # Runs even when the gate failed, so a failing PR still gets its annotations.
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: rqx
