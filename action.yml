name: "Rqx"
description: "Find dead code, duplication and architectural drift in TypeScript, Python, Go, Java and C++, with a reason for every finding."
author: "Jad Alhamwi"
branding:
  icon: search
  color: orange

inputs:
  path:
    description: "Directory to analyze."
    required: false
    default: "."
  base:
    description: "Revision to compare against. Set to an empty string to scan the whole project instead of a diff."
    required: false
    default: ""
  config:
    description: "Path to RQX.toml."
    required: false
    default: ""
  fail-on:
    description: "Lowest severity that fails the job: error, warning, info or never. Empty uses RQX.toml."
    required: false
    default: ""
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "rqx.sarif"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning."
    required: false
    default: "true"

outputs:
  findings:
    description: "Number of findings reported."
    value: ${{ steps.rqx.outputs.findings }}
  passed:
    description: "Whether the gate passed."
    value: ${{ steps.rqx.outputs.passed }}

runs:
  using: composite
  steps:
    # A prebuilt binary turns this from a step that compiles a Rust workspace into one
    # that downloads eight megabytes. Building from source stays as the fallback for a
    # runner no release covers.
    - name: Install rqx
      shell: bash
      run: |
        set -uo pipefail
        version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "${{ github.action_path }}/Cargo.toml" | head -1)"
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS-X64)   target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *)           target="" ;;
        esac

        asset="rqx-${version}-${target}.tar.gz"
        base="https://github.com/jadhamwi21/rqx/releases/download/v${version}"
        if [ -n "$target" ] && curl -fsSL -o "$asset" "$base/$asset"; then
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          grep " $asset\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$asset" --strip-components 1 -C "$HOME/.local/bin" 2>/dev/null \
            || { mkdir -p "$HOME/.local/bin" && tar -xzf "$asset" --strip-components 1 -C "$HOME/.local/bin"; }
          chmod +x "$HOME/.local/bin/rqx"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        else
          echo "no release binary for $RUNNER_OS-$RUNNER_ARCH; building from source"
          rustup toolchain install stable --profile minimal
          cargo install --locked --path "${{ github.action_path }}/crates/rqx-cli"
        fi

    - name: Run rqx
      id: rqx
      shell: bash
      env:
        RQX_PATH: ${{ inputs.path }}
        RQX_BASE: ${{ inputs.base }}
        RQX_CONFIG: ${{ inputs.config }}
        RQX_FAIL_ON: ${{ inputs.fail-on }}
        RQX_SARIF: ${{ inputs.sarif-file }}
      run: |
        set -uo pipefail
        summary="$(mktemp)"

        args=("$RQX_PATH")
        [ -n "$RQX_CONFIG" ] && args+=(--config "$RQX_CONFIG")
        [ -n "$RQX_FAIL_ON" ] && args+=(--fail-on "$RQX_FAIL_ON")

        # One analysis, four renderings: the log, the inline annotations, the SARIF
        # upload and the job summary. Running rqx twice to get two of them doubled
        # the cost of the slowest step in the job.
        args+=(--reporter terminal --reporter github)
        args+=(--reporter "sarif=$RQX_SARIF" --reporter "markdown=$summary")

        if [ -n "$RQX_BASE" ]; then
          # A review diffs `base...HEAD`, which needs the commit the two branches
          # share. `actions/checkout` clones one commit deep by default, so fetching
          # the base one commit deep leaves two histories with no ancestor between
          # them and the diff fails. Deepen until there is one, or say why not.
          git fetch --no-tags origin "$RQX_BASE" 2>/dev/null || true
          if ! git merge-base HEAD FETCH_HEAD >/dev/null 2>&1; then
            git fetch --no-tags --deepen=200 origin "$RQX_BASE" 2>/dev/null || true
          fi
          if ! git merge-base HEAD FETCH_HEAD >/dev/null 2>&1; then
            git fetch --no-tags --unshallow origin "$RQX_BASE" 2>/dev/null || true
          fi
          if ! git merge-base HEAD FETCH_HEAD >/dev/null 2>&1; then
            echo "::warning::no commit shared with $RQX_BASE; add fetch-depth: 0 to actions/checkout"
          fi
          rqx check "${args[@]}" --base "$RQX_BASE"
        else
          rqx scan "${args[@]}"
        fi
        status=$?

        # Appended rather than written: other steps in the job own this file too.
        [ -n "${GITHUB_STEP_SUMMARY:-}" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY"

        findings=$(grep -c '"ruleId"' "$RQX_SARIF" || echo 0)
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "passed=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        exit "$status"

    # Runs even when the gate failed, so a failing PR still gets its annotations.
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: rqx
