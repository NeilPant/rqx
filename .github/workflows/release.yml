name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --target ${{ matrix.target }} --bin rqx

      # A prebuilt binary is the difference between a CI job that adds seconds and
      # one that compiles a Rust workspace before it can lint a line of TypeScript.
      # The version is in the asset name so a client can build the URL from a version
      # it already knows, rather than querying the releases API to find out.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="rqx-${version}-${{ matrix.target }}"
          mkdir "$name"
          if [ -f "target/${{ matrix.target }}/release/rqx.exe" ]; then
            cp "target/${{ matrix.target }}/release/rqx.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/rqx" "$name/"
          fi
          cp README.md LICENSE "$name/" 2>/dev/null || cp README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # An extension that downloads a binary without checking it against a published
      # sum is trusting whatever answered on that URL.
      - name: Checksums
        run: sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            SHA256SUMS
          generate_release_notes: true

  crates:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # In dependency order, and waiting between each, because a crate cannot publish
      # against a version of its dependency the registry has not finished indexing.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for package in rqx-core rqx-lang rqx; do
            cargo publish --locked -p "$package"
            sleep 30
          done
