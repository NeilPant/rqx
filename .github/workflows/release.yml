name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and check, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Everything that can disagree with the tag, before anything is built. A tag is
  # hard to take back once a release and a crates.io version hang off it.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # In full: the reference pages embed examples from the churn rules, which need
      # history to produce. A shallow clone generates shorter pages and the drift
      # test then reports a difference nobody introduced.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            [ "$tagged" = "$manifest" ] || {
              echo "::error::tag v$tagged does not match Cargo.toml $manifest — \
          the assets and the published crate would carry different versions"
              exit 1
            }
          fi

      # The release notes are this section. An empty one ships a release nobody can
      # read, and finding that out after the tag is pushed is too late.
      #
      # Only on a tag: `tools/release.sh` writes the section as it cuts the release,
      # so on a manual rehearsal of the build there is legitimately nothing to find.
      - name: Release notes exist
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes="$(awk -v v="## $version " '
            index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d')"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no entries under \`## $version\`. \
          tools/release.sh writes that section from Unreleased."
            exit 1
          fi
          printf '%s\n' "$notes"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Catches a missing `description`, a path dependency without a version, an
      # excluded file something needs — all of which only fail at publish time,
      # which is after the tag exists.
      #
      # `--workspace` rather than one crate at a time: packaging `rqx-lang` on its own
      # resolves `rqx-core` from the registry, which has not got this version yet, so
      # every release would fail its own check.
      - name: Crates would publish
        run: cargo package --workspace --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --target ${{ matrix.target }} --bin rqx

      # A prebuilt binary is the difference between a CI job that adds seconds and
      # one that compiles a Rust workspace before it can lint a line of TypeScript.
      # The version is in the asset name so a client can build the URL from a version
      # it already knows, rather than querying the releases API to find out.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          name="rqx-${version}-${{ matrix.target }}"
          mkdir "$name"
          if [ -f "target/${{ matrix.target }}/release/rqx.exe" ]; then
            cp "target/${{ matrix.target }}/release/rqx.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/rqx" "$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      # The binary in the tarball has to be the one that runs, on the machine that
      # built it. A cross-built artefact that cannot start is worth catching here.
      - name: It runs
        if: matrix.os != 'ubuntu-24.04-arm' || runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/rqx"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          "$binary" --version
          "$binary" rules --slugs | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      # An extension that downloads a binary without checking it against a published
      # sum is trusting whatever answered on that URL.
      - name: Checksums
        working-directory: assets
        run: sha256sum *.tar.gz > SHA256SUMS

      # The hand-written section, not a list of pull-request titles: the changelog is
      # where the reason for each change is already written down.
      - name: Notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          awk -v v="## $version " '
            index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > NOTES.md
          {
            echo
            echo "---"
            echo
            echo "Verify a download against \`SHA256SUMS\`:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
          } >> NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.tar.gz
            assets/SHA256SUMS
          body_path: NOTES.md
          # A prerelease tag stays a prerelease: `v0.3.0-rc.1` should not become the
          # version an installer picks up as latest.
          prerelease: ${{ contains(github.ref_name, '-') }}

  crates:
    needs: [check, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: crates.io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `--workspace` publishes the three in dependency order and waits for each to
      # index before the next needs it. Doing it by hand meant a `sleep` chosen by
      # guess, and a crate that published against a version the registry had not
      # finished serving.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if output="$(cargo publish --workspace --locked 2>&1)"; then
            echo "$output"
          elif grep -q "already exists\|already uploaded" <<<"$output"; then
            # A re-run after a half-finished publish, not a failure.
            echo "$output"
            echo "::notice::some crates were already on crates.io"
          else
            echo "$output" >&2
            exit 1
          fi

  # The marketplaces, each skipped rather than failed when its token is not
  # configured: a fork cutting a tag should get binaries, not a red pipeline about
  # credentials it was never going to have.
  extensions:
    needs: [check, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: marketplaces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx --yes @vscode/vsce package --out rqx.vsix

      - name: VS Code Marketplace
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT is not set; skipping the VS Code Marketplace"
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath rqx.vsix

      - name: Open VSX
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice::OVSX_PAT is not set; skipping Open VSX"
            exit 0
          fi
          npx --yes ovsx publish rqx.vsix --pat "$OVSX_PAT"

      - uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/rqx.vsix
