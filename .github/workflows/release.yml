name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and check, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Everything that can disagree with the tag, before anything is built. A tag is
  # hard to take back once a release and a crates.io version hang off it.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # In full: the reference pages embed examples from the churn rules, which need
      # history to produce. A shallow clone generates shorter pages and the drift
      # test then reports a difference nobody introduced.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            [ "$tagged" = "$manifest" ] || {
              echo "::error::tag v$tagged does not match Cargo.toml $manifest — \
          the assets and the published crate would carry different versions"
              exit 1
            }
          fi

      # The release notes are this section. An empty one ships a release nobody can
      # read, and finding that out after the tag is pushed is too late.
      #
      # Only on a tag: `tools/release.sh` writes the section as it cuts the release,
      # so on a manual rehearsal of the build there is legitimately nothing to find.
      - name: Release notes exist
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes="$(awk -v v="## $version " '
            index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d')"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no entries under \`## $version\`. \
          tools/release.sh writes that section from Unreleased."
            exit 1
          fi
          printf '%s\n' "$notes"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Catches a missing `description`, a path dependency without a version, an
      # excluded file something needs — all of which only fail at publish time,
      # which is after the tag exists.
      #
      # `--workspace` rather than one crate at a time: packaging `rqx-lang` on its own
      # resolves `rqx-core` from the registry, which has not got this version yet, so
      # every release would fail its own check.
      - name: Crates would publish
        run: cargo package --workspace --locked


  # A tag is the release. The notes are the changelog section the tag carries, which
  # is also what `rqx update` reads, so the two can never disagree.
  publish:
    needs: check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          awk -v v="## $version " '
            index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > NOTES.md
          {
            echo
            echo "---"
            echo
            echo '```sh'
            echo "cargo install --git https://github.com/jadhamwi21/rqx --tag ${{ github.ref_name }} --locked rqx"
            echo '```'
            echo
            echo "An existing install updates itself with \`rqx update\`."
          } >> NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  crates:
    needs: [check, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: crates.io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `--workspace` publishes the three in dependency order and waits for each to
      # index before the next needs it. Doing it by hand meant a `sleep` chosen by
      # guess, and a crate that published against a version the registry had not
      # finished serving.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
            exit 0
          fi
          if output="$(cargo publish --workspace --locked 2>&1)"; then
            echo "$output"
          elif grep -q "already exists\|already uploaded" <<<"$output"; then
            # A re-run after a half-finished publish, not a failure.
            echo "$output"
            echo "::notice::some crates were already on crates.io"
          else
            echo "$output" >&2
            exit 1
          fi
