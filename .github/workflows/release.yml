name: release

on:
  push:
    tags: ["v*"]
  # A rehearsal: everything a tag would do, up to but not including publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything that can disagree with the tag, before anything is built. A tag is
  # hard to take back once a release, a crates.io version and seven npm packages
  # hang off it.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # In full: the reference pages embed examples from the churn rules, which need
      # history to produce. A shallow clone generates shorter pages and the drift
      # test then reports a difference nobody introduced.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            [ "$tagged" = "$manifest" ] || {
              echo "::error::tag v$tagged does not match Cargo.toml $manifest — \
          the assets and the published crate would carry different versions"
              exit 1
            }
          fi

      # The release notes are this section. An empty one ships a release nobody can
      # read, and finding that out after the tag is pushed is too late.
      #
      # Only on a tag: `tools/release.sh` writes the section as it cuts the release,
      # so on a manual rehearsal of the build there is legitimately nothing to find.
      - name: Release notes exist
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes="$(awk -v v="## $version " '
            index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d')"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no entries under \`## $version\`. \
          tools/release.sh writes that section from Unreleased."
            exit 1
          fi
          printf '%s\n' "$notes"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: node --test npm/exit-codes.test.js

      # Catches a missing `description`, a path dependency without a version, an
      # excluded file something needs — all of which only fail at publish time,
      # which is after the tag exists.
      #
      # `--workspace` rather than one crate at a time: packaging `rqx-lang` on its own
      # resolves `rqx-core` from the registry, which has not got this version yet, so
      # every release would fail its own check.
      - name: Crates would publish
        run: cargo package --workspace --locked


  # One binary per platform npm has a name for. Every row builds natively, so there
  # is no cross-compiler, no container and no emulator anywhere in here — and every
  # row can run what it just built, which is the only way an unusable binary is
  # caught before somebody installs it.
  #
  # The Rust triple appears only inside its own job. Artifacts are named for the npm
  # triple, so everything downstream loops over `rqx-*` and needs no lookup table.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { npm: darwin-arm64, target: aarch64-apple-darwin,       os: macos-15 }
          - { npm: darwin-x64,   target: x86_64-apple-darwin,        os: macos-15 }
          - { npm: linux-x64,    target: x86_64-unknown-linux-musl,  os: ubuntu-24.04 }
          - { npm: linux-arm64,  target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { npm: win32-x64,    target: x86_64-pc-windows-msvc,     os: windows-2025 }
          - { npm: win32-arm64,  target: aarch64-pc-windows-msvc,    os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      # `Cargo.toml` trades scan speed and binary size for build time, because an
      # install compiles and somebody is waiting for it. Nobody waits for this one,
      # so the published binary takes the other side of that trade — and loses the
      # 4.5MB of symbols nothing reads, on a file every CI run downloads.
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # An x86_64 build on an arm64 runner; cc picks the arch up from the SDK.
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      # cc maps `aarch64-unknown-linux-musl` to the hard-coded prefix
      # `aarch64-linux-musl-` with no fallback, and Ubuntu's musl-tools installs
      # `musl-gcc` under no prefix at all. Left alone, cc finds neither and quietly
      # compiles the five tree-sitter grammars against glibc headers, which links a
      # binary whose `FILE` layout disagrees with the musl the Rust half is linked
      # to. Naming the compiler is what makes the assertion below pass.
      CC_x86_64_unknown_linux_musl: musl-gcc
      AR_x86_64_unknown_linux_musl: ar
      CC_aarch64_unknown_linux_musl: musl-gcc
      AR_aarch64_unknown_linux_musl: ar
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: musl
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # `crt-static` is already the default for a musl target, and setting RUSTFLAGS
      # to say so again would invalidate every rust-cache key.
      - run: cargo build --locked --release --target ${{ matrix.target }} -p rqx --bin rqx

      - name: It runs
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/rqx"
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          "$binary" --version

      # Linux ships musl so that one binary covers Alpine, Debian and RHEL without a
      # glibc floor to track. That only holds if it is actually static.
      #
      # The test is the absence of a dynamic loader rather than the presence of the
      # word "static", because rustc links x86_64 musl as static-pie and aarch64 musl
      # as plain static, and `file` spells those "static-pie linked" and "statically
      # linked". Matching either spelling passes one arch and fails the other.
      - name: Nothing to link against
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/rqx"
          described="$(file "$binary")"
          echo "$described"
          # Without this, a `file` that recognised nothing would satisfy the test below
          # by saying nothing at all.
          case "$described" in
            *ELF*) ;;
            *) echo "::error::file does not recognise $binary: $described"; exit 1 ;;
          esac
          case "$described" in
            *"dynamically linked"*|*"interpreter "*)
              echo "::error::$binary wants a dynamic loader, so it is not the static \
          build this row exists to produce: $described"
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: rqx-${{ matrix.npm }}
          path: target/${{ matrix.target }}/release/rqx${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
          if-no-files-found: error


  # A tag is the release. The notes are the changelog section the tag carries, which
  # is also what `rqx update` reads, so the two can never disagree.
  #
  # `needs: build` rather than `needs: check` alone: a release object that exists
  # before its assets do is a download link that 404s for whoever is quickest.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: rqx-*
          path: artifacts

      # The executable bit does not survive an artifact upload, and a tarball of a
      # binary nobody can run is worse than no tarball.
      #
      # The binary is named rather than archived as `.`, because `curl | tar xz -C
      # /usr/local/bin` is a documented way to install this and a `./` entry would
      # reset the mode of the directory it unpacks into.
      #
      # One SHA256SUMS written here from all six, rather than one line per build job
      # concatenated afterwards, because six chances to get it wrong is five too many.
      - name: Archives
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          mkdir -p dist
          for dir in artifacts/rqx-*; do
            triple="${dir##*/rqx-}"
            binary=rqx
            if [ -f "$dir/rqx.exe" ]; then binary=rqx.exe; fi
            chmod +x "$dir/$binary"
            tar czf "dist/rqx-$version-$triple.tar.gz" -C "$dir" "$binary"
          done
          (cd dist && sha256sum rqx-*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          awk -v v="## $version " '
            index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > NOTES.md
          {
            echo
            echo "---"
            echo
            echo '```sh'
            echo "npm install --save-dev @rqx/cli@$version"
            echo '```'
            echo
            echo "Or from source, which needs the Rust toolchain:"
            echo
            echo '```sh'
            echo "cargo install --git https://github.com/jadhamwi21/rqx --tag ${{ github.ref_name }} --locked rqx"
            echo '```'
            echo
            echo "Binaries below are checksummed in \`SHA256SUMS\`."
          } >> NOTES.md

      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          body_path: NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/rqx-*.tar.gz
            dist/SHA256SUMS

  crates:
    needs: [check, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: crates.io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `--workspace` publishes the three in dependency order and waits for each to
      # index before the next needs it. Doing it by hand meant a `sleep` chosen by
      # guess, and a crate that published against a version the registry had not
      # finished serving.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
            exit 0
          fi
          if output="$(cargo publish --workspace --locked 2>&1)"; then
            echo "$output"
          elif grep -q "already exists\|already uploaded" <<<"$output"; then
            # A re-run after a half-finished publish, not a failure.
            echo "$output"
            echo "::notice::some crates were already on crates.io"
          else
            echo "$output" >&2
            exit 1
          fi

  # Seven packages: one binary each behind `os`/`cpu`, and `@rqx/cli` on top of them
  # as optional dependencies npm resolves at install time.
  #
  # The version lives in `Cargo.toml` and is written in here, never committed — which
  # is how the tag-matches-the-manifest check above covers npm too, with nothing new
  # that can drift.
  #
  # A tag publishes to npm only once the repository variable PUBLISH_NPM is `true`.
  # Until then the packages are still built and dry-run on a rehearsal, so turning the
  # variable on publishes something that has already been checked.
  npm:
    needs: [check, publish]
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # `npm publish --dry-run` never contacts the registry, so a rehearsal passes on
      # a token that cannot publish `@rqx` at all. The account behind the token is
      # what decides that, and finding it out here costs nothing; finding it out
      # from a 403 costs a tag.
      - name: The token's account
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not set"
            exit 0
          fi
          who="$(npm whoami 2>&1)" \
            && echo "the token publishes as $who" \
            || echo "::warning::the token does not identify an account: $who"

      - uses: actions/download-artifact@v4
        with:
          pattern: rqx-*
          path: artifacts

      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          mkdir -p packages

          for dir in artifacts/rqx-*; do
            triple="${dir##*/rqx-}"
            home="packages/$triple"
            mkdir -p "$home"
            cp "$dir"/rqx* "$home"/
            chmod +x "$home"/rqx*
            node -e '
              const [triple, version] = process.argv.slice(1);
              const [os, cpu] = triple.split("-");
              process.stdout.write(JSON.stringify({
                name: `@rqx/${triple}`,
                version,
                description: `The rqx binary for ${triple}.`,
                license: "MIT",
                repository: { type: "git", url: "git+https://github.com/jadhamwi21/rqx.git" },
                os: [os],
                cpu: [cpu],
              }, null, 2) + "\n");
            ' "$triple" "$version" > "$home/package.json"
          done

          cp -R npm packages/cli
          cp README.md LICENSE packages/cli/
          sed -i "s/\"0\.0\.0\"/\"$version\"/g" packages/cli/package.json
          cat packages/cli/package.json

      # Platform packages first and `@rqx/cli` last, because the main package is the
      # commit point: its optional dependencies are resolved at install time, so one
      # published before its binaries exist is a version that installs into nothing.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.ref_type != 'tag' && 'yes' || '' }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "$DRY_RUN" ] && [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not set; skipping npm"
            exit 0
          fi

          # npm points `latest` at whatever was published last unless told otherwise,
          # so a prerelease would become what `npm install @rqx/cli` resolves to. The
          # hyphen is the same test the GitHub release uses to mark itself a
          # prerelease, so the two can never disagree about what a version is.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          echo "publishing $VERSION under the \`$tag\` dist-tag"

          publish() {
            local home="$1"
            if [ -n "$DRY_RUN" ]; then
              npm publish --dry-run --access public --tag "$tag" "$home" || return 1
              return 0
            fi
            local output
            if output="$(npm publish --provenance --access public --tag "$tag" "$home" 2>&1)"; then
              echo "$output"
            elif grep -q "cannot publish over" <<<"$output"; then
              # A re-run after a half-finished publish, not a failure.
              echo "$output"
              echo "::notice::$home was already on npm"
            else
              echo "$output" >&2
              return 1
            fi
          }

          for home in ./packages/*/; do
            [ "$home" = "./packages/cli/" ] && continue
            publish "$home" || exit 1
          done
          publish ./packages/cli/ || exit 1
