name: rqx

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `rqx check` diffs against a base, which needs history, not a shallow clone.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # In CI as well as in the pull-request checklist, because a formatting diff
      # nobody asked for is noise in every review that follows it.
      - name: Format
        run: cargo fmt --all -- --check

      # The rule reference is generated from the catalogue. A rule added without
      # regenerating it leaves the docs describing a tool that no longer exists.
      - name: Documentation is current
        run: |
          cargo run --release -- docs
          git diff --exit-code docs/

      # One pass per language, so a regression names the language it broke rather
      # than moving a total nobody can read.
      - name: Analyze each language's fixtures
        run: |
          for language in typescript python go java cpp; do
            echo "## $language" >> "$GITHUB_STEP_SUMMARY"
            cargo run --release -- scan "fixtures/$language" --max-findings 0 \
              --reporter terminal --reporter github \
              --reporter "markdown=rqx-$language.md"
            cat "rqx-$language.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Analyze every language at once
        run: |
          cargo run --release -- scan fixtures --max-findings 0 \
            --reporter terminal \
            --reporter sarif=rqx.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: rqx.sarif
          category: rqx
