name: rqx

on:
  pull_request:
  push:
    branches: [main]
  # So a branch can be checked before it is a pull request. The bench job only runs
  # on `main`, so a manual run skips it.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # The binary ships for macOS and Windows as well as Linux, and the scan, the git
  # history checks and the process handling all differ between them. Tests that only
  # ever ran on Linux say nothing about the other two.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  # `rust-version` promises users a compiler floor. Nothing else in CI builds on that
  # floor, so a dependency or a newer std API can break it without any job going red.
  #
  # The version is read from Cargo.toml rather than written here, so raising the floor
  # in one place moves this job with it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version for this job to test"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.version.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # `--all-targets` because the tests and examples are code the floor has to compile
      # too, not only the library a downstream user links.
      - run: cargo check --workspace --all-targets --locked

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `rqx check` diffs against a base, which needs history, not a shallow clone.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # In CI as well as in the pull-request checklist, because a formatting diff
      # nobody asked for is noise in every review that follows it.
      - name: Format
        run: cargo fmt --all -- --check

      # The rule reference is generated from the catalogue. A rule added without
      # regenerating it leaves the docs describing a tool that no longer exists.
      - name: Documentation is current
        run: |
          cargo run --release -- docs
          git diff --exit-code docs/

      - name: Bench summary reads every hyperfine format
        run: python3 -I tools/bench/test_summary.py

      # One pass per language, so a regression names the language it broke rather
      # than moving a total nobody can read.
      - name: Analyze each language's fixtures
        run: |
          for language in typescript javascript python go java cpp; do
            echo "## $language" >> "$GITHUB_STEP_SUMMARY"
            cargo run --release -- scan "fixtures/$language" --max-findings 0 \
              --reporter terminal --reporter github \
              --reporter "markdown=rqx-$language.md"
            cat "rqx-$language.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Analyze every language at once
        run: |
          cargo run --release -- scan fixtures --max-findings 0 \
            --reporter terminal \
            --reporter sarif=rqx.sarif

      # A pull request from a fork gets a read-only token whatever `permissions` asks
      # for, and the upload needs `security-events: write`. Skipping it there keeps a
      # correct change from showing a failure that is not the author's.
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && !github.event.pull_request.head.repo.fork
        with:
          sarif_file: rqx.sarif
          category: rqx

  # The scan is a performance tool as much as a correctness one, and the counts that
  # prove it (cache hits, walks, files read) are asserted in `cargo test`, where they
  # cannot flake. This job is the other half: the wall time, which varies with the
  # runner, so it is only reported. It never fails the run and never runs on a pull
  # request, where a noisy number would be read as a verdict on the change.
  bench:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned to 1.x: 2.0 moved the timings in its JSON export, and the summary
      # reads both, but a number that changes meaning under the same job is worse
      # than a pin that is raised on purpose.
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine@1.19.0

      - run: cargo build --release --locked

      - name: Make the synthetic corpus
        run: tools/bench/synth.sh 10

      # `run.sh` prints hyperfine's own output and then a summary; only the summary
      # goes to the page.
      - name: Time cold, warm and warm-after-edit scans
        run: |
          set -o pipefail
          tools/bench/run.sh --corpus synth target/release/rqx | tee bench.log
          {
            echo "## Scan timings (synthetic corpus)"
            echo '```'
            sed -n '/^summary/,$p' bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # install.sh and install.ps1 are the first thing a new user runs, so a broken one is
  # the worst first impression. Their dry runs need no build, only GitHub.
  install-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the shell installer and its test
        run: shellcheck install.sh tools/install-test.sh

      - name: Installer checks
        run: tools/install-test.sh

  # The PowerShell installer runs on Windows, so it is linted and dry-run there.
  install-scripts-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint install.ps1
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -EnableExit

      - name: Dry run install.ps1
        shell: pwsh
        run: ./install.ps1 -DryRun

  # Advisories, licenses, duplicate versions and sources, against the policy in
  # deny.toml. Kept out of `analyze` so a newly published advisory, which can land on a
  # commit that changed nothing, fails a job that says what it is about.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
