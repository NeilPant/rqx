name: Rule proposal
description: Something rqx should find and does not
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: |
        A rule has to be decidable from syntax, scope resolution, the import graph or
        git history. rqx parses and does not type-check. A rule also names the
        refactoring that answers it. If both of the first two fields below can be
        filled in, the proposal probably fits.
  - type: textarea
    id: measures
    attributes:
      label: What it measures
      description: Concretely enough that two people would agree on whether it fired.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Refactoring that answers it
      description: The named refactoring, if there is one.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Code that should trigger it
      render: text
    validations:
      required: true
  - type: textarea
    id: precision
    attributes:
      label: Precision evidence
      description: The repositories or files the rule was tried on, and how many findings were true positives and how many were false positives.
      placeholder: "Tried on src/ of github.com/org/repo: 14 findings, 12 true positives, 2 false positives"
  - type: input
    id: languages
    attributes:
      label: Which languages
      placeholder: typescript, python
