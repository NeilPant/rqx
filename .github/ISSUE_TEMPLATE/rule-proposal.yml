name: Rule proposal
description: Something rqx should find and does not
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: |
        Every rule has to be decidable from syntax, scope resolution, the import
        graph or git history — rqx parses, it does not type-check. And every rule
        names the refactoring that answers it. If you can fill in both boxes below,
        it probably fits.
  - type: textarea
    id: measures
    attributes:
      label: What it measures
      description: Concretely enough that two people would agree on whether it fired.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What the reader should do about it
      description: A named refactoring if there is one.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Code that should trigger it
      render: text
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Which languages
      placeholder: typescript, python
