blank_issues_enabled: true
contact_links:
  - name: Question, or unsure whether it is a bug
    url: https://github.com/jadhamwi21/rqx/discussions
    about: Ask in Discussions first. Answers sometimes lead to documentation fixes.
  - name: Security problem
    url: https://github.com/jadhamwi21/rqx/security/advisories/new
    about: Report privately through a security advisory, or by email to the maintainer (see SECURITY.md). Do not open a public issue.
  - name: The rule reference
    url: https://github.com/jadhamwi21/rqx/tree/main/docs/rules
    about: Lists every rule, what it measures, and why it fires. Check it before reporting a false positive.
