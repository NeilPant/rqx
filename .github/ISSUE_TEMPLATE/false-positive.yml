name: False positive
description: A rule reported a finding on correct code
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        A rule that reports correct code teaches users to ignore the tool. False
        positives are handled before other issues.
  - type: input
    id: rule
    attributes:
      label: Which rule
      placeholder: long-function
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: The smallest code that triggers it
      description: Code that can be pasted into a fixture as it is.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is correct
      description: What the rule does not account for in this code.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rqx --version
    validations:
      required: true
