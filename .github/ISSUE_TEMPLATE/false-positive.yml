name: False positive
description: A rule fired on code that is fine
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        A rule that fires on good code is worse than a rule that does not exist —
        it teaches people to ignore the tool. These get priority.
  - type: input
    id: rule
    attributes:
      label: Which rule
      placeholder: long-function
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: The smallest code that triggers it
      description: Ideally something we can paste into a fixture.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is fine
      description: What the rule missed about this code.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rqx --version
    validations:
      required: true
