[workspace]
resolver = "3"
members = ["crates/rqx-core", "crates/rqx-lang", "crates/rqx-cli"]
# The Zed extension is a wasm32 cdylib against a different toolchain target, so it is
# built by Zed rather than by `cargo build --workspace`.
exclude = ["editors/zed"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Jad Alhamwi"]
repository = "https://github.com/jadhamwi21/rqx"
homepage = "https://github.com/jadhamwi21/rqx"
keywords = ["static-analysis", "linter", "code-quality", "refactoring", "dead-code"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
rqx-core = { path = "crates/rqx-core" }
rqx-lang = { path = "crates/rqx-lang" }

[profile.release]
lto = "thin"
codegen-units = 1
