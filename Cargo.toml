[workspace]
resolver = "3"
members = ["crates/rqx-core", "crates/rqx-lang", "crates/rqx-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Jad Alhamwi"]
repository = "https://github.com/jadhamwi21/rqx"
homepage = "https://github.com/jadhamwi21/rqx"
keywords = ["static-analysis", "linter", "code-quality", "refactoring", "dead-code"]
categories = ["development-tools", "command-line-utilities"]

# The version is here and nowhere else. A published crate needs one beside the path,
# and three manifests each carrying their own is three chances for a release to bump
# the package and leave its siblings depending on the version before it.
[workspace.dependencies]
rqx-core = { version = "0.1.1", path = "crates/rqx-core" }
rqx-lang = { version = "0.1.1", path = "crates/rqx-lang" }

[profile.release]
lto = "thin"
codegen-units = 1
