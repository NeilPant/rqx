[workspace]
resolver = "3"
members = ["crates/rqx-core", "crates/rqx-lang", "crates/rqx-cli"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Jad Alhamwi"]
repository = "https://github.com/jadhamwi21/rqx"
homepage = "https://github.com/jadhamwi21/rqx"
keywords = ["static-analysis", "linter", "code-quality", "refactoring", "dead-code"]
categories = ["development-tools", "command-line-utilities"]

# The version is here and nowhere else. A published crate needs one beside the path,
# and three manifests each carrying their own is three chances for a release to bump
# the package and leave its siblings depending on the version before it.
[workspace.dependencies]
rqx-core = { version = "0.5.2", path = "crates/rqx-core" }
rqx-lang = { version = "0.5.2", path = "crates/rqx-lang" }

# `codegen-units = 1` built the binary crate as one unit no core could share: 183 of
# the 228 seconds a clean install took, all of it serialised at the end. Sixteen
# units brings that to 68 seconds and costs 2.4% of scan time and 4MB of binary,
# measured on a 3,456-file corpus. Splitting at all is what costs the 2.4%; four
# units cost the same and built slower, so there is nothing to buy back by going
# lower. Installing from source is the thing people wait for — the published
# binaries take the other side of this trade, in the release workflow's build job,
# because nobody waits for that one.
[profile.release]
lto = "thin"
codegen-units = 16

# Full debug info for every dependency was most of a debug build's 3.5GB on disk and
# much of its link time, and nobody steps through tree-sitter's internals. Line tables
# keep file:line in backtraces for rqx's own code; dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
